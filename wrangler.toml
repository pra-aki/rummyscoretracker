name = "rummy"
main = "./dist/_worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# Serve index.html for paths with no matching file, so shared links like
# /game/<id> reach the router instead of 404ing. Pages did this implicitly;
# Workers needs it stated.
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "rummy"
database_id = "dae39638-676b-4ac8-9d6f-b759d9b488c5"
